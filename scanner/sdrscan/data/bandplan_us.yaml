# Generic United States band plan for the RTL-SDR Blog V4 range (about 24 MHz to 1766 MHz).
# Frequencies are integer Hz. Bands are half-open [lo_hz, hi_hz) and must not overlap.
# tier A: revisited about every 15 s (voice bands that matter for "what is happening now").
# tier B: the rest, revisited every few minutes.
# policy: dwell (voice; may get a dwell), occupancy (count energy only),
#         decoder (left for a later external decoder job), ignore (never swept).
# Site-specific channel names go in a local labels file, never in this file.

defaults:
  mode: unknown
  raster_hz: 12500
  bw_hz: 12500
  gain_db: 32.8
  tier: B
  policy: occupancy
  deviation_hz: 2500

bands:
