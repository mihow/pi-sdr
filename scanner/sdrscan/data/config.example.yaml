# Example sdrscan configuration. Every key shown here is the built-in default, so an
# empty file behaves the same. Copy it to /etc/sdrscan/config.yaml and change what you need.
# Secrets (upload URLs with signatures, passwords) never go here: put them in the env file
# named by uplink.secrets_env (mode 0600).

site_id: site
data_root: /var/lib/sdrscan
stage_root: /run/sdrscan       # tmpfs; partial recordings never touch the SD card
# bandplan_path defaults to the packaged US band plan.
labels_path: null              # optional local display names; never commit a site's file

duty:
  survey_min_share: 0.55
  dwell_max_share: 0.40
  dwell_min_share: 0.15       # kept for dwells even when slow hops stretch the voice-band sweep
  calibrate_share: 0.05         # upper bound; quiet-hour baselines use far less
  calibrate_interval_s: 300.0
  calibrate_s: 1.0
  survey_hop_s: 0.1
  dwell_max_s: 60.0
  dwell_cooldown_s: 30.0
  dwell_block_s: 0.1
  tier_a_revisit_s: 15.0
  critical_hop_interval_s: 1.0

detect:
  threshold_db: 10.0           # offset above the per-hop floor; never an absolute level
  fm_threshold_db: 15.0
  nfft: 4096
  navg: 50
  crop_frac: 0.10
  dc_mask_bins: 3
  tune_offset_hz: 150000
  min_width_hz: 500.0
  clip_level: 0.99
  dwell_open_snr_db: 20.0
  hang_s: 2.0
  keyup_max_s: 5.0            # a dwell carrier this short with no voice or data is a key-up
  always_on_duty: 0.80

quota:
  clip_quota_bytes: 2147483648 # 2 GiB, about 550 h of 8 kbit/s Opus speech
  per_channel_share: 0.10
  free_evict_frac: 0.15
  free_prune_frac: 0.12
  free_pinned_frac: 0.10
  free_stop_frac: 0.05
  raw_retention_days: 90
  min_clip_s: 1.5

thermal:
  hot_c: 70.0
  very_hot_c: 78.0
  critical_c: 82.0
  hysteresis_c: 3.0
  sample_interval_s: 30.0

uplink:
  target: file                 # file | http_put | http_post
  url: null
  path: null
  secrets_env: null
  cap_bytes: 30000000          # hard monthly cap, counted by the on-device ledger
  interval_s: 3600.0
  slow_interval_s: 10800.0
  slow_frac: 0.80
  tls_overhead_bytes: 6000
  outbox_keep: 48
  include_transcripts: false

live:
  enabled: false
  bind_address: null           # read at install time; never committed
  port: 8073

stt:                           # speech-to-text on kept voice clips; off by default
  # none | auto | whisper_cpp | sherpa_parakeet | sherpa_moonshine | faster_whisper
  # auto runs the engine `sdrscan stt-bench` chose on this host (see choice_path).
  engine: none
  threads: 2
  min_confidence: 0.6          # below this a transcript is stored but never shown as fact
  queue_max: 50
  whisper_binary: null         # path to whisper-cli
  whisper_model: null          # path to a ggml model, for example base.en
  whisper_audio_ctx: 1024      # -ac sized to the clip, at least this; 0 = full context
  whisper_suppress_nst: false  # whisper-cli -sns
  parakeet_model: null         # sherpa-onnx Parakeet TDT 0.6B v2 int8 directory
  moonshine_model: null        # sherpa-onnx Moonshine int8 directory
  faster_whisper_model: null   # CTranslate2 (faster-whisper) model directory
  faster_whisper_beam: 5
  choice_path: null            # engine: auto; default <data_root>/stt-choice.json
  fallback: sherpa_parakeet,faster_whisper,whisper_cpp   # auto with no valid choice
  max_rtf: 0.5                 # stt-bench limits: real-time factor at `threads`
  max_rss_mb: 1200.0           #   peak resident memory of the engine process
  max_model_mb: 800.0          #   model files on disk
  max_noise_shown_frac: 0.15   #   share of noise clips with a transcript shown as fact

prose:                         # optional one-paragraph summary from a small local LLM
  engine: none                 # none | llama_cli
  binary: null
  model: null
  threads: 2
