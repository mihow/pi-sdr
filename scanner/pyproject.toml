[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sdrscan"
dynamic = ["version"]
description = "Unattended RTL-SDR spectrum scanner that summarizes channel activity on device"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyyaml>=6.0",
    "webrtcvad>=2.0.10",
]

[project.optional-dependencies]
rtl = ["pyrtlsdr>=0.3"]
dev = ["pytest>=8", "ruff==0.7.4"]
browser = ["playwright>=1.40"]

[project.scripts]
sdrscan = "sdrscan.cli:main"

[tool.setuptools.dynamic]
version = { attr = "sdrscan.__version__" }

[tool.setuptools.packages.find]
include = ["sdrscan*"]

[tool.setuptools.package-data]
sdrscan = ["data/*.yaml", "web/*.tmpl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: long scene simulations and browser checks",
    "browser: needs Playwright",
    "fixtures: needs recorded IQ under SDRSCAN_IQ_FIXTURES",
    "hw: needs a real RTL-SDR dongle; never run in CI",
    "docker: starts a local container (MinIO); skipped when Docker or the image is absent",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
